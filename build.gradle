plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }

    test {
        java {
            srcDirs = ['test']
        }
    }
}

application {
    mainClass = 'minesweeper.MinesweeperGUIApplication'
}

tasks.register('runConsole', JavaExec) {
    group = 'application'
    description = 'Runs the console Minesweeper application.'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'minesweeper.MinesweeperApplication'
    standardInput = System.in
}

tasks.named('test') {
    useJUnitPlatform()
}
